    <title>한전KDN | 글로벌 에너지ICT의 중심</title>
    <script>
      // GitHub Pages SPA redirect 복원
      // 404.html 에서 넘겨준 ?p= 경로를 history.replaceState 로 복원한 뒤 React 가 렌더
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p != null) {
          var q = params.get('q');
          var base = window.location.pathname; // /kdn-board/
          window.history.replaceState(
            null, null,
            base + p.replace(/~and~/g, '&') + (q ? '?' + q.replace(/~and~/g, '&') : '') + window.location.hash
          );
        }
      })();
    </script>
